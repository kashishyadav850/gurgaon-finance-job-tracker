name: Update job listings

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you also trigger it manually from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Run scraper
        run: python main.py

      - name: Commit updated listings if changed
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@github.com"
          git add data/listings.json
          git diff --cached --quiet && echo "No changes" || git commit -m "Update listings [automated]"
          git push
